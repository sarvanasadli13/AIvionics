<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AIvionics">
  <!-- AIvionics mark — CONCEPT B, DARK TILE.
       Rebuilt as vector from the reference: rounded tile, circular dial,
       sky above, a diagnostic trace crossing it. Two deliberate changes:
       the trace is an avionics signal (flat, one deflection) rather than an
       ECG pulse, and the left bars are set as clean decreasing index tabs so
       they read as a manual index instead of noise.
       No text in the icon — it is illegible below 32px and the OS renders the
       app name beside it anyway. Use logo-b-*.svg for the lockup. -->
  <title>AIvionics</title>
  <defs>
    <clipPath id="bd"><circle cx="32" cy="30" r="19"/></clipPath>
    <linearGradient id="skyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FCBEC"/><stop offset="1" stop-color="#CFE7F6"/>
    </linearGradient>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="15" fill="#0F1C29" stroke="#7FB6DC" stroke-width="2"/>
  <circle cx="32" cy="30" r="19" fill="#FFFFFF"/>
  <g clip-path="url(#bd)">
    <rect x="13" y="11" width="38" height="19" fill="url(#skyD)"/>
    <g fill="#5A6B7C">
      <rect x="12" y="20.4" width="14" height="2.4" rx="1.2"/>
      <rect x="12" y="26.0" width="11" height="2.4" rx="1.2"/>
      <rect x="12" y="31.6" width="13" height="2.4" rx="1.2"/>
      <rect x="12" y="37.2" width="9"  height="2.4" rx="1.2"/>
    </g>
    <path d="M13 30 H26 L29.5 30 L32 17.5 L34.5 41 L37 30 H51"
          fill="none" stroke="#2E9BE0" stroke-width="2.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
