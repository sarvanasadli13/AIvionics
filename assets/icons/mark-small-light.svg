<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AIvionics">
  <title>AIvionics</title>
  <!-- The AIvionics mark, small form (light). For 16-24 px, where the index
       rules and the reticle ticks are noise rather than detail - rendered both
       ways at 16/20/24, the ticks merge into the ring and the mark reads as a
       lozenge. Ring, dot and bar are what survive, so they are all that is
       drawn. Rendered at final size by make_icon.py, never downsampled. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#FFFFFF" stroke="#0F2C42" stroke-width="2.5"/>
  <rect x="7" y="29.2" width="50" height="5.6" rx="2.8" fill="#0E74BC"/>
  <circle cx="36" cy="32" r="13.5" fill="none" stroke="#0F2C42" stroke-width="3.4"/>
  <circle cx="36" cy="32" r="5.0" fill="#0E74BC"/>
</svg>
