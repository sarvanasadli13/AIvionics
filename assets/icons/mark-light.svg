<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AIvionics">
  <title>AIvionics</title>
  <!-- The AIvionics mark (light) - an ATA locator: a reticle sitting on one
       line of an index. Chosen by the owner on 2026-08-24 over two attitude
       indicators, on the strength of its 16 px silhouette and because it draws
       what the product does rather than what the industry looks like.

       No `clip-path` anywhere: Qt's SVG renderer is SVG Tiny 1.2 and ignores
       clipPath, which is what made the pre-22-August mark paint its sky as a
       square overhanging the dial. Every shape here is a primitive. -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="#FFFFFF" stroke="#0F2C42" stroke-width="2"/>
  <g fill="#C6DCEC">
    <rect x="12" y="14.5" width="26" height="3.4" rx="1.7"/>
    <rect x="12" y="45.6" width="20" height="3.4" rx="1.7"/>
  </g>
  <rect x="12" y="30.3" width="40" height="3.4" rx="1.7" fill="#0E74BC"/>
  <circle cx="38" cy="32" r="11.5" fill="none" stroke="#0F2C42" stroke-width="2.4"/>
  <g stroke="#0F2C42" stroke-width="2.2" stroke-linecap="round">
    <path d="M38 17.5 V22"/><path d="M38 42 V46.5"/>
    <path d="M23.5 32 H28"/><path d="M48 32 H52.5"/>
  </g>
  <circle cx="38" cy="32" r="3.2" fill="#0E74BC"/>
</svg>
