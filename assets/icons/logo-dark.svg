<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 198 64" width="198" height="64" role="img" aria-label="AIvionics">
  <!-- AIvionics horizontal lockup — DARK.
       Mark: rounded tile, ATA locator - a reticle on one line of an index.
       Wordmark: "AI" in the accent AND the capital I set in a serif face.
       Both are load-bearing — the colour carries it in normal use, the serif
       crossbars guarantee it can never be read as a lowercase "l" when the
       logo is printed in one colour, engraved, or faxed.

       The wordmark is OUTLINED, as docs/mockups/logo-sheet.html requires
       before final export. It was set in Segoe UI Variable Display 28px
       (A: 800, vionics: 600) and Georgia Bold (I), letter-spacing -0.3,
       baseline y=41 starting at x=74, then converted to paths. Neither face
       exists on Windows 10, and Qt's SVG renderer ignores `x` on a <tspan>,
       so live text here re-flowed or printed on top of the tile. Edit the
       wordmark by re-setting that specification, not by nudging the curves.

       The viewBox is tight to the ink (the old 300-unit box left 32% empty
       on the right, which pushed the lockup off-centre wherever it was
       centred as a whole). -->
  <title>AIvionics</title>
  <!-- Mark: ATA locator (owner's choice, 2026-08-24). A reticle on one line
       of an index. Identical geometry to assets/icons/mark-dark.svg, shifted
       2 units up because the lockup tile sits at y=1 rather than y=3. No
       `clip-path` and no gradients - every shape is a primitive, so Qt's SVG
       Tiny renderer draws exactly what a browser does. -->
  <rect x="3" y="1" width="58" height="58" rx="15" fill="#0F1C29" stroke="#9FC7E4" stroke-width="2"/>
  <g fill="#22394E">
    <rect x="12" y="12.5" width="26" height="3.4" rx="1.7"/>
    <rect x="12" y="43.6" width="20" height="3.4" rx="1.7"/>
  </g>
  <rect x="12" y="28.3" width="40" height="3.4" rx="1.7" fill="#5BB4F0"/>
  <circle cx="38" cy="30" r="11.5" fill="none" stroke="#9FC7E4" stroke-width="2.4"/>
  <g stroke="#9FC7E4" stroke-width="2.2" stroke-linecap="round">
    <path d="M38 15.5 V20"/><path d="M38 40 V44.5"/>
    <path d="M23.5 30 H28"/><path d="M48 30 H52.5"/>
  </g>
  <circle cx="38" cy="30" r="3.2" fill="#5BB4F0"/>

