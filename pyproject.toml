[project]
name = "aivionics"
version = "0.1.0"
description = "AIvionics - reliability analysis and manual retrieval for avionics engineering"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "fastembed",
    "flashrank",
    "sqlite-vec",
    "PySide6",
    "QtAwesome>=1.3,<2",
    "pyqtgraph",
    "bcrypt",
    "timezonefinder",
    "pymupdf",
    # Secure API-key storage. On Windows this resolves to the
    # WinVaultKeyring backend (Credential Manager); AIvionics refuses to
    # persist a key at all when no secure backend is present.
    "keyring>=24,<26",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
